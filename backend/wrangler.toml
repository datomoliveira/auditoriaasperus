name = "auditoria-api"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
MAX_UPLOAD_SIZE_MB = "25"
# Chaves de IA devem ser configuradas como secrets no Cloudflare:
#   wrangler secret put AI_API_KEY_GROK
#   wrangler secret put AI_API_KEY_GOOGLE
#   wrangler secret put AI_API_KEY_OLLAMA
# Opcional: AI_ROUTING_CHAIN define a ordem de fallback (ex.: "grok,google,ollama").
#
# Observação: o deploy padrão deste projeto é via Cloudflare Pages Functions
# (pasta ../functions), que reaproveita as variáveis do projeto Pages. Este
# wrangler.toml serve apenas para publicar um Worker standalone, se desejado.
